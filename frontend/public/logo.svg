<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Qwenematics: a film reel whose outline is a Q; the film strip running off it is the Q's tail. -->
  <rect width="64" height="64" rx="14" fill="#1a1d22"/>
  <!-- reel -->
  <circle cx="28" cy="28" r="21" fill="#6aa8ff"/>
  <g fill="#1a1d22">
    <circle cx="28" cy="16.5" r="5.2"/>
    <circle cx="38.9" cy="24.4" r="5.2"/>
    <circle cx="34.8" cy="37.3" r="5.2"/>
    <circle cx="21.2" cy="37.3" r="5.2"/>
    <circle cx="17.1" cy="24.4" r="5.2"/>
    <circle cx="28" cy="28" r="2.6"/>
  </g>
  <!-- tail: a strip of film crossing the reel's rim, like the stroke of a Q -->
  <g transform="translate(37 44) rotate(32)">
    <rect x="-2" y="-6.5" width="25" height="13" rx="2" fill="#f0b44c" stroke="#1a1d22" stroke-width="2"/>
    <g fill="#1a1d22">
      <rect x="2" y="-5" width="3" height="2.6" rx=".6"/><rect x="9" y="-5" width="3" height="2.6" rx=".6"/><rect x="16" y="-5" width="3" height="2.6" rx=".6"/>
      <rect x="2" y="2.4" width="3" height="2.6" rx=".6"/><rect x="9" y="2.4" width="3" height="2.6" rx=".6"/><rect x="16" y="2.4" width="3" height="2.6" rx=".6"/>
    </g>
  </g>
</svg>
